name: civix_app
description: "Civix — unbiased daily political briefs for teens."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # state management
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6

  # navigation
  go_router: ^18.0.0

  # networking
  dio: ^5.7.0

  # local persistence
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.4

  # notifications
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

  # misc
  url_launcher: ^6.3.1
  flutter_animate: ^4.5.2
  intl: ^0.20.2

  # codegen runtime
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.4.13
  freezed: ^4.0.1
  json_serializable: ^6.9.0
  riverpod_generator: ^4.0.8
  drift_dev: ^2.22.1

  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/sample_briefs/
